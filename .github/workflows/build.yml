name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q MoodKeysAI_v0.2.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        working-directory: MoodKeysAI
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MoodKeysAI-debug-apk
          path: MoodKeysAI/app/build/outputs/apk/debug/app-debug.apk
